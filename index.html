<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendario Escolar Inteligente</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">

<style>
body { background-color: #f0f2f5; padding: 20px; font-family: -apple-system, sans-serif; }
.container { max-width: 900px; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
#calendar { margin-top: 25px; background: white; padding: 10px; border-radius: 10px; }
.card { border: none; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
.fc-event { border: none !important; padding: 2px 5px; font-weight: 500; }
</style>
</head>
<body>

<div class="container">
<h2 class="text-center mb-4">Mis Evaluaciones</h2>

<div class="card p-3 mb-4">
<div class="row g-3">
<div class="col-md-4">
<label class="form-label">Materia</label>
<input type="text" id="materia" class="form-control" placeholder="Ej: Biología, Física...">
</div>
<div class="col-md-4">
<label class="form-label">Actividad</label>
<input type="text" id="actividad" class="form-control" placeholder="Ej: Examen, Tarea...">
</div>
<div class="col-md-3">
<label class="form-label">Fecha</label>
<input type="date" id="fecha" class="form-control">
</div>
<div class="col-md-1 d-flex align-items-end">
<button onclick="agregarEvento()" class="btn btn-primary w-100">Añadir</button>
</div>
</div>
</div>

<div id="calendar"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>

<script>
let calendar;

// Función que asigna colores automáticamente
function obtenerColorPorMateria(materia) {
const m = materia.toLowerCase();
if (m.includes('bio')) return '#28a745'; // Verde para Biología
if (m.includes('mat')) return '#007bff'; // Azul para Matemáticas
if (m.includes('fis')) return '#6f42c1'; // Morado para Física
if (m.includes('qui')) return '#fd7e14'; // Naranja para Química
if (m.includes('cast') || m.includes('leng')) return '#e83e8c'; // Rosa para Castellano/Lengua
if (m.includes('ing')) return '#17a2b8'; // Cian para Inglés
if (m.includes('hist') || m.includes('geo')) return '#6c757d'; // Gris para Historia/Geografía

return '#343a40'; // Negro/Gris oscuro para otras materias
}

document.addEventListener('DOMContentLoaded', function() {
const calendarEl = document.getElementById('calendar');
const eventosGuardados = JSON.parse(localStorage.getItem('mis_evaluaciones')) || [];

calendar = new FullCalendar.Calendar(calendarEl, {
initialView: 'dayGridMonth',
locale: 'es',
headerToolbar: { left: 'prev,next today', center: 'title', right: 'dayGridMonth' },
events: eventosGuardados,
eventClick: function(info) {
if (confirm("¿Eliminar " + info.event.title + "?")) {
info.event.remove();
guardarEnMemoria();
}
}
});
calendar.render();
});

function agregarEvento() {
const materia = document.getElementById('materia').value;
const actividad = document.getElementById('actividad').value;
const fecha = document.getElementById('fecha').value;

if (!materia || !actividad || !fecha) {
alert("Completa todos los campos");
return;
}

const color = obtenerColorPorMateria(materia);

const nuevoEvento = {
title: `${actividad} de ${materia}`,
start: fecha,
allDay: true,
backgroundColor: color
};

calendar.addEvent(nuevoEvento);
guardarEnMemoria();

document.getElementById('materia').value = '';
document.getElementById('actividad').value = '';
document.getElementById('fecha').value = '';
}

function guardarEnMemoria() {
const todosLosEventos = calendar.getEvents().map(event => ({
title: event.title,
start: event.startStr,
allDay: event.allDay,
backgroundColor: event.backgroundColor
}));
localStorage.setItem('mis_evaluaciones', JSON.stringify(todosLosEventos));
}
</script>

</body>
</html>
